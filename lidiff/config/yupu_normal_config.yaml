experiment:
    id: yupu_new

##Data
data:
    #data_dir: '/nas2/jacob/data/YUPU_data_combined_train_test_bin'
    data_dir: '/nas2/jacob/data/YUPU_data_bin'
    resolution: 0.10
    dataloader: 'SensatNormal'
    split: 'train'
    #train: ['L_T1_train']
    #validation: ['L_T1_test']
    #test: ['L_T1_test']
    train: ['L_T1_619065_4846213', 'L_T1_619947_4846213', 'L_T1_619947_4847977', 'L_T2_619065_4846213', 'L_T2_619065_4847977', 'L_T2_619947_4847095', 'L_T2_620829_4846213', 'L_T1_619065_4847977', 'L_T1_619947_4847095', 'L_T1_620829_4846213']
    validation: ['L_T2_619065_4847095', 'L_T2_619947_4846213']
    test: ['L_T2_619947_4847977']
    num_points: 48000
    upsample_ratio: 4
    max_range: 50.
    dataset_norm: False
    std_axis_norm: False

##Training
train:
    uncond_prob: 0.1
    uncond_w: 6.
    n_gpus: 1
    num_workers: 4
    max_epoch: 20
    lr: 0.0001
    batch_size: 2
    decay_lr: 1.0e-4

diff:
    beta_start: 3.5e-5
    beta_end: 0.007
    beta_func: 'linear'
    t_steps: 1000
    s_steps: 50
    reg_weight: 5.0

##Network
model:
    out_dim: 96
    

projection:
    maxpoolz: 5
    maxpoolxy: 11
    maxpoolpadz: 2
    maxpoolpadxy: 5
    convz: 5
    convxy: 5
    convsigmaxy: 1
    convsigmaz: 2
    convpadz: 2
    convpadxy: 2
    imgbias: 0.0
    depth_bias: 0.3
    obj_ratio: 0.70
    bg_clr: 0.0
    resolution: 224
    depth: 112