experiment:
    id: yupu_lidiff_clip_highres

##Data
data:
    data_dir: '/nas2/jacob/data/YUPU_data_bin'
    resolution: 0.10
    dataloader: 'Sensat'
    split: 'train'
    train: ['L_T1_619065_4846213', 'L_T1_619947_4846213', 'L_T1_619947_4847977', 'L_T2_619065_4846213', 'L_T2_619065_4847977', 'L_T2_619947_4847095', 'L_T2_620829_4846213', 'L_T1_619065_4847977', 'L_T1_619947_4847095', 'L_T1_620829_4846213']
    validation: ['L_T2_619065_4847095', 'L_T2_619947_4846213']
    test: ['L_T2_619947_4847977'] #'birmingham_block_8', 'cambridge_block_15', 'cambridge_block_22', 'cambridge_block_16', 'cambridge_block_27'
    num_points: 48000
    upsample_ratio: 4
    max_range: 50.
    dataset_norm: False
    std_axis_norm: False

##Training
train:
    uncond_prob: 0.1
    uncond_w: 6.
    n_gpus: 1
    num_workers: 4
    max_epoch: 20
    lr: 0.0001
    batch_size: 1
    decay_lr: 1.0e-4

diff:
    beta_start: 3.5e-5
    beta_end: 0.007
    beta_func: 'linear'
    t_steps: 1000
    s_steps: 50
    reg_weight: 5.0

##Network
model:
    out_dim: 96
    

projection:
    maxpoolz: 3
    maxpoolxy: 3
    maxpoolpadz: 1
    maxpoolpadxy: 1
    convz: 3
    convxy: 3
    convsigmaxy: 0.5
    convsigmaz: 1
    convpadz: 1
    convpadxy: 1
    imgbias: 0.0
    depth_bias: 0.3
    obj_ratio: 0.95
    bg_clr: 0.0
    resolution: 224
    depth: 112